  <title>StudyDesk • Unified Application Prototype</title>

    })();

  <style>
    :root {
      --color-shell-bg: #181716;
      --color-shell-surface: #22201E;
      --color-shell-border: rgba(255, 255, 255, 0.10);
      --color-shell-border-active: rgba(44, 94, 67, 0.6);
      --color-shell-text: #FBF9F5;
      --color-shell-muted: #A09B91;
      --color-accent: #2C5E43;
      --color-accent-hover: #377654;
      --color-accent-soft: rgba(44, 94, 67, 0.25);
      --color-frame-bg: #FAF6EF;
    }

    [data-theme="dark"] {
      --color-shell-bg: #141312;
      --color-shell-surface: #1E1C1A;
      --color-shell-border: rgba(255, 255, 255, 0.12);
      --color-shell-border-active: rgba(78, 145, 125, 0.6);
      --color-shell-text: #F3EFEA;
      --color-shell-muted: #9E968D;
      --color-accent: #4E917D;
      --color-accent-hover: #5EA893;
      --color-accent-soft: rgba(78, 145, 125, 0.25);
      --color-frame-bg: #141312;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-shell-bg);
      color: var(--color-shell-text);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .shell-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Prototype Switcher Bar */
    .prototype-header {
      height: 48px;
      min-height: 48px;
      background: var(--color-shell-bg);
      border-bottom: 1px solid var(--color-shell-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 9999;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, background-color 0.2s ease;
      user-select: none;
    }

    .prototype-header.collapsed {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Left Brand */
    .shell-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-shell-text);
      cursor: pointer;
    }

    .shell-brand-icon {
      width: 26px;
      height: 26px;
      background: var(--color-accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .shell-brand-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .shell-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: var(--color-shell-muted);
    }

    /* Center Segmented View Switcher */
    .segmented-switcher {
      display: flex;
      align-items: center;
      background: var(--color-shell-surface);
      border: 1px solid var(--color-shell-border);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }

    .switcher-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--color-shell-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
      outline: none;
    }

    .switcher-btn:hover {
      color: var(--color-shell-text);
      background: rgba(255, 255, 255, 0.06);
    }

    .switcher-btn.active {
      background: var(--color-accent);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .switcher-btn .key-badge {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.3);
      color: rgba(255, 255, 255, 0.85);
    }

    /* Right Actions */
    .shell-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-shell-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--color-shell-border);
      color: var(--color-shell-muted);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-shell-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-shell-text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Floating Restore Pill (when bar is hidden or in Focus Mode) */
    .floating-restore-pill {
      position: fixed;
      top: 10px;
      right: 14px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(24, 23, 22, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-shell-text);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .floating-restore-pill.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .floating-restore-pill:hover {
      background: var(--color-shell-bg);
      border-color: var(--color-accent);
      color: #FFFFFF;
      transform: translateY(1px);
    }

    /* Viewports Area */
    .viewports-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100vh - 48px);
      position: relative;
      background: var(--color-frame-bg);
      overflow: hidden;
      transition: height 0.28s ease, background-color 0.2s ease;
    }

    .prototype-header.collapsed ~ .viewports-wrapper {
      height: 100vh;
    }

    .view-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: var(--color-frame-bg);
    }

    .view-frame.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="shell-container">
    <!-- Prototype Switcher Navigation Header -->
    <header class="prototype-header" id="prototypeHeader">
      <div class="shell-brand" id="brandResetBtn" title="StudyDesk Prototype">
        <div class="shell-brand-icon">S</div>
        <span class="shell-brand-text">StudyDesk</span>
        <span class="shell-badge">Unified Suite</span>
      </div>

      <!-- Segmented View Switcher -->
      <nav class="segmented-switcher" role="tablist" aria-label="Prototype Views">
        <button class="switcher-btn active" data-view="dashboard" role="tab" id="tabDashboard">
          <span>🏠 Dashboard</span>
          <span class="key-badge">1</span>
        </button>
        <button class="switcher-btn" data-view="course" role="tab" id="tabCourse">
          <span>📚 Course Syllabus</span>
          <span class="key-badge">2</span>
        </button>
        <button class="switcher-btn" data-view="learning" role="tab" id="tabLearning">
          <span>🎯 Learning Desk</span>
          <span class="key-badge">3</span>
        </button>
      </nav>

      <!-- Right Action Tools -->
      <div class="shell-actions">
        <button class="btn-shell-ghost" id="btnToggleShellTheme" title="Toggle Unified Prototype Theme (Key: T)">
          <span id="shellThemeIcon">🌙</span>
          <span id="shellThemeLabel">Theme</span>
          <span class="key-badge">T</span>
        </button>
        <button class="btn-shell-ghost" id="btnToggleBar" title="Hide navigation bar for full focus (or press H)">
          <span>Hide Bar</span>
          <span class="key-badge">H</span>
        </button>
      </div>
    </header>

    <!-- Floating Restore Pill (Visible when bar is hidden) -->
    <div class="floating-restore-pill" id="floatingRestorePill" title="Show prototype switcher (or press H)">
      <span>⇄</span>
      <span>Show Views (H)</span>
    </div>

    <!-- Viewports Container -->
    <main class="viewports-wrapper">
      <iframe class="view-frame active" id="frame-dashboard" data-view="dashboard" title="Dashboard"></iframe>
      <iframe class="view-frame" id="frame-course" data-view="course" title="Course Page"></iframe>
      <iframe class="view-frame" id="frame-learning" data-view="learning" title="Learning Page"></iframe>
    </main>
  </div>

    };

    function decodeUtf8Base64(base64) {
      const binString = atob(base64);
      const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
      return new TextDecoder().decode(bytes);
    }

    // DOM Elements
    const prototypeHeader = document.getElementById('prototypeHeader');
    const floatingRestorePill = document.getElementById('floatingRestorePill');
    const btnToggleBar = document.getElementById('btnToggleBar');
    const btnToggleShellTheme = document.getElementById('btnToggleShellTheme');
    const brandResetBtn = document.getElementById('brandResetBtn');

    const frames = {
      dashboard: document.getElementById('frame-dashboard'),
      course: document.getElementById('frame-course'),
      learning: document.getElementById('frame-learning')
    };

    const tabs = {
      dashboard: document.getElementById('tabDashboard'),
      course: document.getElementById('tabCourse'),
      learning: document.getElementById('tabLearning')
    };

    let currentView = 'dashboard';
    let isHeaderUserCollapsed = false;

    // Global Theme Coordination - Bulletproof Multi-Channel Engine
    let shellBroadcastChannel = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        shellBroadcastChannel = new BroadcastChannel('studydesk_theme_sync');
      }
    } catch (e) {}

    function getStoredTheme() {
      try {
        const ls = localStorage.getItem('studydesk_theme');
        if (ls === 'dark' || ls === 'light') return ls;
      } catch (e) {}
      try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          return 'dark';
        }
      } catch (e) {}
      return 'light';
    }

    function setStoredTheme(theme) {
      try {
        localStorage.setItem('studydesk_theme', theme);
      } catch (e) {}
    }

    let globalTheme = getStoredTheme();

    function prepareSrcdoc(base64Html) {
      let html = decodeUtf8Base64(base64Html);
      // Boot directly with current globalTheme so child document renders in target theme from byte 1
      html = html.replace(/<html([^>]*)data-theme=["'][^"']*["']/i, `<html$1data-theme="${globalTheme}"`);
      html = html.replace(/<html(?![^>]*data-theme)/i, `<html data-theme="${globalTheme}"`);
      return html;
    }

    function applyGlobalTheme(theme, broadcastToChildren = true) {
      globalTheme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', globalTheme);
      setStoredTheme(globalTheme);

      const icon = document.getElementById('shellThemeIcon');
      const label = document.getElementById('shellThemeLabel');
      if (icon) icon.textContent = globalTheme === 'dark' ? '☀️' : '🌙';
      if (label) label.textContent = globalTheme === 'dark' ? 'Espresso' : 'Paper';

      // Direct DOM update on all frames + localStorage + postMessage
      Object.values(frames).forEach(frame => {
        try {
          if (frame && frame.contentDocument && frame.contentDocument.documentElement) {
            frame.contentDocument.documentElement.setAttribute('data-theme', globalTheme);
          }
        } catch (e) {}
        try {
          if (frame && frame.contentWindow) {
            try { frame.contentWindow.localStorage.setItem('studydesk_theme', globalTheme); } catch(e){}
            if (broadcastToChildren) {
              frame.contentWindow.postMessage({ type: 'SD_THEME_CHANGE', theme: globalTheme }, '*');
            }
          }
        } catch (e) {}
      });

      if (broadcastToChildren && shellBroadcastChannel) {
        try {
          shellBroadcastChannel.postMessage({ type: 'SD_THEME_CHANGE', theme: globalTheme });
        } catch (e) {}
      }
    }

    function toggleGlobalTheme() {
      applyGlobalTheme(globalTheme === 'dark' ? 'light' : 'dark', true);
    }

    // Load iframe sources via srcdoc with dynamic theme injection and early load listeners
    function initializeFrames() {
      Object.values(frames).forEach(frame => {
        frame.addEventListener('load', () => {
          try {
            if (frame.contentDocument && frame.contentDocument.documentElement) {
              frame.contentDocument.documentElement.setAttribute('data-theme', globalTheme);
            }
            if (frame.contentWindow) {
              try { frame.contentWindow.localStorage.setItem('studydesk_theme', globalTheme); } catch(e){}
              frame.contentWindow.postMessage({ type: 'SD_THEME_CHANGE', theme: globalTheme }, '*');
            }
          } catch (e) {}
        });
      });

      frames.dashboard.srcdoc = prepareSrcdoc(PAGES_DATA.dashboard);
      frames.course.srcdoc = prepareSrcdoc(PAGES_DATA.course);
      frames.learning.srcdoc = prepareSrcdoc(PAGES_DATA.learning);
    }

    // View Switching
    function switchView(viewName, targetUrl) {
      if (!frames[viewName]) return;
      currentView = viewName;

      // Update Tabs
      Object.keys(tabs).forEach(key => {
        tabs[key].classList.toggle('active', key === viewName);
      });

      // Update Frames
      Object.keys(frames).forEach(key => {
        frames[key].classList.toggle('active', key === viewName);
      });

      // Ensure active frame is immediately in sync with current global theme
      try {
        const frame = frames[viewName];
        if (frame.contentDocument && frame.contentDocument.documentElement) {
          frame.contentDocument.documentElement.setAttribute('data-theme', globalTheme);
        }
        if (frame.contentWindow) {
          try { frame.contentWindow.localStorage.setItem('studydesk_theme', globalTheme); } catch(e){}
          frame.contentWindow.postMessage({ type: 'SD_THEME_CHANGE', theme: globalTheme }, '*');
        }
      } catch(e) {}

      // Update URL Hash
      if (window.location.hash.replace('#', '') !== viewName) {
        window.location.hash = viewName;
      }

      // If switching to learning page with chapter / timestamp query parameters
      if (viewName === 'learning' && targetUrl && targetUrl.includes('?')) {
        const query = targetUrl.split('?')[1];
        const params = new URLSearchParams(query);
        const chapter = params.get('chapter');
        const seconds = params.get('t');

        if (frames.learning.contentWindow) {
          frames.learning.contentWindow.postMessage({
            type: 'SD_SET_CHAPTER_TIME',
            chapter: chapter,
            seconds: seconds
          }, '*');
        }
      }
    }

    // Toggle Header Collapse
    function setHeaderCollapsed(collapsed) {
      prototypeHeader.classList.toggle('collapsed', collapsed);
      floatingRestorePill.classList.toggle('show', collapsed);
    }

    btnToggleBar.addEventListener('click', () => {
      isHeaderUserCollapsed = !isHeaderUserCollapsed;
      setHeaderCollapsed(isHeaderUserCollapsed);
    });

    if (btnToggleShellTheme) {
      btnToggleShellTheme.addEventListener('click', toggleGlobalTheme);
    }

    floatingRestorePill.addEventListener('click', () => {
      isHeaderUserCollapsed = false;
      setHeaderCollapsed(false);
    });

    brandResetBtn.addEventListener('click', () => {
      switchView('dashboard');
    });

    // Tab Click Listeners
    Object.keys(tabs).forEach(key => {
      tabs[key].addEventListener('click', () => {
        switchView(key);
      });
    });

    // Listen for cross-frame messages from child pages
    window.addEventListener('message', (e) => {
      if (!e.data) return;

      if (e.data.type === 'SD_NAVIGATE') {
        const target = e.data.target;
        const url = e.data.url;
        if (target === 'dashboard' || target === 'course' || target === 'learning') {
          switchView(target, url);
        }
      } else if (e.data.type === 'SD_THEME_CHANGE' && e.data.theme) {
        const newTheme = e.data.theme;
        applyGlobalTheme(newTheme, true);
      } else if (e.data.type === 'SD_FOCUS_MODE') {
        // Auto-collapse header when user enters Focus Mode in Learning page
        if (e.data.active) {
          setHeaderCollapsed(true);
        } else if (!isHeaderUserCollapsed) {
          setHeaderCollapsed(false);
        }
      } else if (e.data.type === 'SD_KEY') {
        handleGlobalKey(e.data.key);
      }
    });

    // 5-Way Redundant Cross-frame and Cross-tab Synchronization:
    if (shellBroadcastChannel) {
      shellBroadcastChannel.onmessage = (e) => {
        if (e.data && e.data.theme) {
          applyGlobalTheme(e.data.theme, true);
        }
      };
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'studydesk_theme' && e.newValue) {
        applyGlobalTheme(e.newValue, true);
      }
    });

    function syncShellTheme() {
      const saved = getStoredTheme();
      if (saved !== globalTheme) {
        applyGlobalTheme(saved, true);
      }
    }

    window.addEventListener('focus', syncShellTheme);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncShellTheme();
    });
    window.addEventListener('pageshow', syncShellTheme);
    setInterval(syncShellTheme, 300);

    // Global Key Handler
    function handleGlobalKey(key) {
      if (key === '1') switchView('dashboard');
      else if (key === '2') switchView('course');
      else if (key === '3') switchView('learning');
      else if (key === 't' || key === 'T') {
        toggleGlobalTheme();
      } else if (key === 'h' || key === 'H') {
        isHeaderUserCollapsed = !isHeaderUserCollapsed;
        setHeaderCollapsed(isHeaderUserCollapsed);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        if (e.key === '1' || e.key === '2' || e.key === '3' || e.key === 'h' || e.key === 'H' || e.key === 't' || e.key === 'T') {
          handleGlobalKey(e.key);
        }
      }
    });

    // Sync with browser hash on load / popstate
    function syncHash() {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      if (hash === 'course' || hash === 'learning' || hash === 'dashboard') {
        switchView(hash);
      } else {
        switchView('dashboard');
      }
    }

    window.addEventListener('hashchange', syncHash);

    // Boot
    applyGlobalTheme(globalTheme, false);
    initializeFrames();
    syncHash();
  </script>
